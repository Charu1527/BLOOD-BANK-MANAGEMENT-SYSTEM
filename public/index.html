<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blood Bank Management System</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f8;--sf:#fff;--tx:#1b2430;--mu:#5d6b7c;--ln:#d9dfe7;--ac:#a31526;--ac2:#fbe7ea;--ok:#1e7a4c;--wn:#b36b00;--bd:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--sf:#1b2129;--tx:#e8ecf1;--mu:#9aa7b6;--ln:#2d3744;--ac:#ef5a6b;--ac2:#3a1c22;--ok:#4cc38a;--wn:#f0a73c;--bd:#ff7b72;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12161c;--sf:#1b2129;--tx:#e8ecf1;--mu:#9aa7b6;--ln:#2d3744;--ac:#ef5a6b;--ac2:#3a1c22;--ok:#4cc38a;--wn:#f0a73c;--bd:#ff7b72;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif}
header{background:var(--sf);border-bottom:2px solid var(--ac);padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
h1{font-size:18px;margin:0;font-weight:600;flex:1;min-width:180px}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px 12px;background:var(--sf);border-bottom:1px solid var(--ln)}
nav button{border:0;background:none;color:var(--mu);padding:8px 14px;border-radius:6px;font:inherit;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--ac2);color:var(--ac);font-weight:600}
main{max-width:1100px;margin:0 auto;padding:16px}
h2{font-size:16px;margin:20px 0 8px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat b{font-size:26px;display:block;line-height:1.1}.stat span{color:var(--mu);font-size:13px}
.bags{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:12px}
.bag{text-align:center}
.bag i{display:block;height:84px;border:2px solid var(--ac);border-radius:6px 6px 18px 18px;background:linear-gradient(to top,var(--ac) var(--f),transparent var(--f));position:relative;margin-bottom:4px}
.bag i.low{border-color:var(--bd);border-style:dashed}
.bag strong{font-size:15px}.bag small{display:block;color:var(--mu)}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;align-items:end}
label{font-size:13px;color:var(--mu);display:flex;flex-direction:column;gap:3px}
input,select{font:inherit;padding:7px 8px;border:1px solid var(--ln);border-radius:6px;background:var(--bg);color:var(--tx);min-width:0}
button.b{background:var(--ac);color:#fff;border:0;border-radius:6px;padding:8px 14px;font:inherit;cursor:pointer}
button.g{background:none;color:var(--ac);border:1px solid var(--ac);border-radius:6px;padding:4px 9px;font:inherit;font-size:13px;cursor:pointer;margin:1px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.w{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:640px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--ln);font-size:14px;vertical-align:middle}
th{color:var(--mu);font-weight:500;font-size:13px}
.code{font-family:ui-monospace,Consolas,monospace;font-size:13px}
.tag{padding:2px 8px;border-radius:10px;font-size:12px;background:var(--ac2);color:var(--ac);white-space:nowrap}
.tag.Available{background:rgba(30,122,76,.15);color:var(--ok)}.tag.Quarantine{background:rgba(179,107,0,.15);color:var(--wn)}
.tag.Discarded{background:rgba(179,38,30,.15);color:var(--bd)}
.alert{padding:8px 10px;border-left:4px solid var(--wn);background:var(--bg);margin:6px 0;border-radius:4px;font-size:14px}
.alert.bad{border-color:var(--bd)}.mu{color:var(--mu)}
.chk{flex-direction:row;align-items:center;gap:3px;display:inline-flex;margin-right:6px}
</style></head><body>
<header><h1>Blood Bank Management System</h1>
<button class="g" onclick="resetDemo()">Reset demo data</button></header>
<nav id="nav"></nav><main id="app"></main>
<script>
const G=["O-","O+","A-","A+","B-","B+","AB-","AB+"],SH={RBC:42,Platelets:5,Plasma:365},TT=["HIV","HBV","HCV","Syphilis","Malaria"];
const TABS=["Dashboard","Donors","Lab","Inventory","Requests","Trace","Audit"];
let S,tab="Dashboard",msg="";
const today=()=>new Date().toISOString().slice(0,10);
const addD=(d,n)=>new Date(new Date(d).getTime()+n*864e5).toISOString().slice(0,10);
const diff=(a,b)=>Math.round((new Date(a)-new Date(b))/864e5);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const abo=g=>g.replace(/[+-]/,"");
function ok(comp,d,r){
 if(comp==="Plasma"){const a=abo(d),b=abo(r);return a==="AB"||a===b}
 if(comp==="Platelets")return abo(d)===abo(r);
 const rbc={"O-":["O-"],"O+":["O-","O+"],"A-":["O-","A-"],"A+":["O-","O+","A-","A+"],"B-":["O-","B-"],"B+":["O-","O+","B-","B+"],"AB-":["O-","A-","B-","AB-"],"AB+":G};
 return rbc[r].includes(d)}
function load(){try{S=JSON.parse(localStorage.getItem("bbms"))}catch(e){S=null}if(!S)S=seed()}
function save(){try{localStorage.setItem("bbms",JSON.stringify(S))}catch(e){}}
function log(m){S.audit.unshift({t:new Date().toLocaleString(),m});S.audit=S.audit.slice(0,150)}
function seed(){
 S={donors:[],units:[],reqs:[],audit:[],n:1,rn:1,dn:1};
 const names=["Asha Verma","Rohit Singh","Meera Nair","Imran Khan","Priya Sharma","Karan Mehta","Sana Ali","Vikram Rao"];
 names.forEach((n,i)=>S.donors.push({id:"D"+String(S.dn++).padStart(3,"0"),name:n,age:22+i*4,sex:i%2?"M":"F",group:G[i],wt:55+i*3,hb:13.2+i*.2,last:addD(today(),-(60+i*20))}));
 G.forEach((g,i)=>{for(let k=0;k<(i%3)+2;k++){const d=S.donors[(i+k)%8],c=k===3?"Platelets":"RBC",col=addD(today(),-(k*9+i%4));
  S.units.push({id:"BB"+String(S.n++).padStart(5,"0"),donor:d.id,group:g,comp:c,col,exp:addD(col,SH[c]),status:"Available",tests:[]})}});
 S.units.push({id:"BB"+String(S.n++).padStart(5,"0"),donor:"D001",group:"O-",comp:"RBC",col:today(),exp:addD(today(),42),status:"Quarantine",tests:[]});
 log("Demo data loaded");return S}
function resetDemo(){try{localStorage.removeItem("bbms")}catch(e){}S=seed();save();msg="Demo data restored.";render()}
function sweep(){S.units.forEach(u=>{if(!["Issued","Discarded"].includes(u.status)&&u.exp<today()){u.status="Discarded";u.why="Expired";log(u.id+" discarded: expired")}})}
function elig(d){const r=[];if(d.age<18||d.age>65)r.push("age must be 18 to 65");if(d.wt<45)r.push("weight under 45 kg");if(d.hb<12.5)r.push("Hb under 12.5 g/dL");
 if(d.last){const gap=diff(today(),d.last),need=d.sex==="M"?90:120;if(gap<need)r.push("only "+gap+" days since last donation (needs "+need+")")}return r}
function addDonor(e){e.preventDefault();const f=e.target,v=n=>f[n].value;
 const d={id:"D"+String(S.dn++).padStart(3,"0"),name:v("name").trim(),age:+v("age"),sex:v("sex"),group:v("group"),wt:+v("wt"),hb:+v("hb"),last:v("last")};
 if(!d.name){msg="Enter the donor’s name.";return render()}
 S.donors.push(d);const r=elig(d);log("Donor "+d.id+" registered, "+(r.length?"deferred: "+r.join(", "):"eligible"));
 msg=r.length?d.name+" is deferred: "+r.join(", ")+".":d.name+" is eligible to donate.";save();render()}
function collect(id){const d=S.donors.find(x=>x.id===id),c=document.getElementById("c"+id).value,r=elig(d);
 if(r.length){msg="Cannot collect: "+r.join(", ")+".";return render()}
 const u={id:"BB"+String(S.n++).padStart(5,"0"),donor:id,group:d.group,comp:c,col:today(),exp:addD(today(),SH[c]),status:"Quarantine",tests:[]};
 S.units.push(u);d.last=today();log(u.id+" collected from "+id+" ("+c+"), quarantined");msg="Collected "+u.id+". It stays in quarantine until lab release.";save();render()}
function release(id){const u=S.units.find(x=>x.id===id);
 u.tests=TT.filter(t=>document.getElementById(id+t).checked);
 if(u.tests.length){u.status="Discarded";u.why="TTI reactive: "+u.tests.join(", ");log(id+" discarded, reactive for "+u.tests.join(", ")+"; donor "+u.donor+" flagged")}
 else{u.status="Available";log(id+" passed all tests, now Available")}
 msg=id+(u.tests.length?" discarded (reactive).":" released to stock.");save();render()}
function discard(id){const u=S.units.find(x=>x.id===id);u.status="Discarded";u.why="Manual discard";log(id+" discarded manually");save();render()}
function addReq(e){e.preventDefault();const f=e.target;
 S.reqs.push({id:"R"+String(S.rn++).padStart(4,"0"),hosp:f.hosp.value.trim()||"Unnamed hospital",group:f.group.value,comp:f.comp.value,qty:+f.qty.value,urg:f.urg.value,status:"Pending",units:[]});
 log("Request R"+String(S.rn-1).padStart(4,"0")+" raised ("+f.urg.value+")");msg="Request raised.";save();render()}
function allocate(id){const r=S.reqs.find(x=>x.id===id);sweep();
 const c=S.units.filter(u=>u.status==="Available"&&u.comp===r.comp&&ok(r.comp,u.group,r.group))
  .sort((a,b)=>(a.group===r.group?0:1)-(b.group===r.group?0:1)||a.exp.localeCompare(b.exp));
 const need=r.qty-r.units.length,pick=c.slice(0,need);pick.forEach(u=>{u.status="Reserved";u.req=id;r.units.push(u.id)});
 r.status=r.units.length>=r.qty?"Reserved":r.units.length?"Partial":"Shortage";
 log(id+": "+pick.length+" unit(s) reserved (exact match first, then earliest expiry)");
 msg=pick.length?pick.length+" unit(s) reserved for "+id+".":"No compatible stock for "+id+".";save();render()}
function issue(id){const r=S.reqs.find(x=>x.id===id);r.units.forEach(u=>S.units.find(x=>x.id===u).status="Issued");r.status="Issued";
 log(id+" issued to "+r.hosp+": "+r.units.join(", "));msg="Issued to "+r.hosp+".";save();render()}
function cancel(id){const r=S.reqs.find(x=>x.id===id);r.units.forEach(u=>{const x=S.units.find(y=>y.id===u);x.status="Available";delete x.req});r.units=[];r.status="Cancelled";log(id+" cancelled, units released");save();render()}
const stock=()=>G.map(g=>({g,n:S.units.filter(u=>u.group===g&&u.status==="Available").length}));
const tag=s=>'<span class="tag '+s+'">'+s+"</span>";
const sel=(a,v)=>a.map(x=>"<option"+(x===v?" selected":"")+">"+x+"</option>").join("");
const V={
Dashboard(){const av=S.units.filter(u=>u.status==="Available"),exp=av.filter(u=>diff(u.exp,today())<=5),st=stock(),mx=Math.max(6,...st.map(s=>s.n));
 let al=st.filter(s=>s.n<2).map(s=>'<div class="alert bad">Low stock: '+s.g+" has "+s.n+" unit(s) available.</div>").join("");
 al+=exp.map(u=>'<div class="alert">'+u.id+" ("+u.group+" "+u.comp+") expires "+u.exp+" ("+diff(u.exp,today())+" days). Issue first.</div>").join("");
 return '<div class="grid"><div class="card stat"><b>'+av.length+'</b><span>Available units</span></div><div class="card stat"><b>'+S.units.filter(u=>u.status==="Quarantine").length+'</b><span>In quarantine</span></div><div class="card stat"><b>'+S.reqs.filter(r=>["Pending","Partial","Shortage"].includes(r.status)).length+'</b><span>Open requests</span></div><div class="card stat"><b>'+exp.length+'</b><span>Expiring in 5 days</span></div></div>'+
 '<h2>Stock by blood group</h2><div class="card bags">'+st.map(s=>'<div class="bag"><i class="'+(s.n<2?"low":"")+'" style="--f:'+Math.round(s.n/mx*100)+'%"></i><strong>'+s.g+"</strong><small>"+s.n+" units</small></div>").join("")+"</div>"+
 "<h2>Alerts</h2><div class='card'>"+(al||'<span class="mu">No alerts. Stock is healthy.</span>')+"</div>"},
Donors(){return '<div class="card"><form onsubmit="addDonor(event)"><label>Name<input name="name" required></label><label>Age<input name="age" type="number" value="28" min="1"></label><label>Sex<select name="sex"><option>M</option><option>F</option></select></label><label>Blood group<select name="group">'+sel(G)+'</select></label><label>Weight (kg)<input name="wt" type="number" value="62"></label><label>Hb (g/dL)<input name="hb" type="number" step="0.1" value="13.5"></label><label>Last donation<input name="last" type="date"></label><button class="b">Register and screen</button></form></div>'+
 '<div class="card w"><table><tr><th>ID</th><th>Name</th><th>Group</th><th>Last donation</th><th>Status</th><th>Collect</th></tr>'+
 S.donors.map(d=>{const r=elig(d);return "<tr><td class='code'>"+d.id+"</td><td>"+esc(d.name)+"</td><td>"+d.group+"</td><td>"+(d.last||"never")+"</td><td>"+(r.length?'<span class="tag Discarded" title="'+esc(r.join("; "))+'">Deferred</span> <small class="mu">'+esc(r[0])+"</small>":'<span class="tag Available">Eligible</span>')+"</td><td>"+(r.length?"":'<select id="c'+d.id+'">'+sel(Object.keys(SH))+'</select> <button class="g" onclick="collect(\''+d.id+'\')">Collect</button>')+"</td></tr>"}).join("")+"</table></div>"},
Lab(){const q=S.units.filter(u=>u.status==="Quarantine");
 return '<div class="card w"><p class="mu" style="margin-top:0">Tick any test that came back reactive. Units with no reactive result are released to stock.</p>'+(q.length?'<table><tr><th>Unit</th><th>Group</th><th>Component</th><th>Reactive tests</th><th></th></tr>'+q.map(u=>"<tr><td class='code'>"+u.id+"</td><td>"+u.group+"</td><td>"+u.comp+"</td><td>"+TT.map(t=>'<label class="chk"><input type="checkbox" id="'+u.id+t+'">'+t+"</label>").join("")+'</td><td><button class="g" onclick="release(\''+u.id+'\')">Record and release</button></td></tr>').join("")+"</table>":'<span class="mu">No units waiting for tests. Collect a donation from the Donors tab.</span>')+"</div>"},
Inventory(){return '<div class="card w"><table><tr><th>Unit</th><th>Group</th><th>Component</th><th>Collected</th><th>Expires</th><th>Status</th><th></th></tr>'+
 S.units.slice().sort((a,b)=>a.exp.localeCompare(b.exp)).map(u=>{const dd=diff(u.exp,today());return "<tr><td class='code'>"+u.id+"</td><td>"+u.group+"</td><td>"+u.comp+"</td><td>"+u.col+"</td><td>"+u.exp+(u.status==="Available"&&dd<=5?' <span class="tag Discarded">'+dd+"d</span>":"")+"</td><td>"+tag(u.status)+(u.why?' <small class="mu">'+esc(u.why)+"</small>":"")+"</td><td>"+(["Available","Quarantine"].includes(u.status)?'<button class="g" onclick="discard(\''+u.id+'\')">Discard</button>':"")+"</td></tr>"}).join("")+"</table></div>"},
Requests(){const o={Emergency:0,Urgent:1,Routine:2},rs=S.reqs.slice().sort((a,b)=>o[a.urg]-o[b.urg]);
 return '<div class="card"><form onsubmit="addReq(event)"><label>Hospital<input name="hosp" value="City General"></label><label>Patient group<select name="group">'+sel(G,"A+")+'</select></label><label>Component<select name="comp">'+sel(Object.keys(SH))+'</select></label><label>Units<input name="qty" type="number" value="2" min="1" max="10"></label><label>Urgency<select name="urg">'+sel(["Routine","Urgent","Emergency"])+'</select></label><button class="b">Raise request</button></form></div>'+
 '<div class="card w"><table><tr><th>ID</th><th>Hospital</th><th>Patient</th><th>Need</th><th>Urgency</th><th>Status</th><th>Units</th><th></th></tr>'+
 (rs.map(r=>"<tr><td class='code'>"+r.id+"</td><td>"+esc(r.hosp)+"</td><td>"+r.group+"</td><td>"+r.qty+" × "+r.comp+"</td><td>"+r.urg+"</td><td>"+tag(r.status==="Issued"?"Available":r.status==="Shortage"?"Discarded":"Quarantine").replace(/>[^<]*</,">"+r.status+"<")+"</td><td class='code'>"+r.units.join(", ")+"</td><td>"+(["Issued","Cancelled"].includes(r.status)?"":'<button class="g" onclick="allocate(\''+r.id+'\')">Allocate</button>'+(r.units.length?'<button class="g" onclick="issue(\''+r.id+'\')">Issue</button><button class="g" onclick="cancel(\''+r.id+'\')">Cancel</button>':""))+"</td></tr>").join("")||'<tr><td colspan="8" class="mu">No requests yet. Raise one above.</td></tr>')+"</table></div>"},
Trace(){return '<div class="card"><form onsubmit="event.preventDefault();window.tq=this.q.value.trim().toUpperCase();render()"><label>Unit barcode<input name="q" value="'+esc(window.tq||"")+'" placeholder="BB00001"></label><button class="b">Trace</button></form></div>'+(()=>{
 if(!window.tq)return"";const u=S.units.find(x=>x.id===window.tq);if(!u)return'<div class="card">No unit found with barcode '+esc(window.tq)+".</div>";
 const d=S.donors.find(x=>x.id===u.donor),r=S.reqs.find(x=>x.units.includes(u.id));
 return '<div class="card"><b>Donor to recipient trail</b><div class="alert">Donor: '+(d?esc(d.name)+" ("+d.id+", "+d.group+")":u.donor)+"</div><div class='alert'>Collected "+u.col+", "+u.comp+", expires "+u.exp+"</div><div class='alert'>Tests: "+(u.tests.length?"reactive for "+u.tests.join(", "):u.status==="Quarantine"?"pending":"all non-reactive")+"</div><div class='alert'>Status: "+u.status+(u.why?" ("+esc(u.why)+")":"")+"</div>"+(r?"<div class='alert'>Request "+r.id+" for "+esc(r.hosp)+", patient "+r.group+" ("+r.status+")</div>":"")+"</div>"})()},
Audit(){return '<div class="card">'+S.audit.map(a=>'<div class="alert"><span class="mu">'+a.t+"</span> "+esc(a.m)+"</div>").join("")+"</div>"}
};
function render(){sweep();
 $n=document.getElementById("nav");$n.innerHTML=TABS.map(t=>'<button class="'+(t===tab?"on":"")+'" onclick="tab=\''+t+'\';msg=\'\';render()">'+t+"</button>").join("");
 document.getElementById("app").innerHTML=(msg?'<div class="alert" role="status">'+esc(msg)+"</div>":"")+V[tab]()}
load();save();render();
</script></body></html>
